name: Daily Signal Update
on:
  schedule:
    # Mo-Fr 20:00 UTC = 22:00 deutsche Sommerzeit (direkt nach US-Schluss)
    - cron: "0 20 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engine.py", "universe.py", "template.html", "build_site.py", "positions.json"]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run signal engine
        run: python engine.py > /dev/null
      - name: Build & push site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNAL_REPO: ${{ github.repository }}
        run: python build_site.py
      - name: Enable GitHub Pages (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}' || true
