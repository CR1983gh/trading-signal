name: Daily Signal Update
on:
  schedule:
    # Backup-Slots: GitHub verzoegert Crons oft. 20:00 UTC = 22:00 DE (Hauptlauf),
    # 23:00 und 03:00 UTC als Nachholelaeufe (build_site.py ueberspringt, wenn Daten unveraendert).
    - cron: "0 20 * * 1-5"
    - cron: "0 23 * * 1-5"
    - cron: "0 3 * * 2-6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engine.py", "universe.py", "template.html", "build_site.py", "positions.json"]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run signal engine (retry x3)
        run: |
          for i in 1 2 3; do
            if python engine.py > /tmp/engine.log 2>&1; then echo "Engine OK (attempt $i)"; break; fi
            echo "Engine attempt $i failed:"; tail -20 /tmp/engine.log
            if [ "$i" = "3" ]; then exit 1; fi
            sleep 30
          done
      - name: Build & push site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNAL_REPO: ${{ github.repository }}
        run: python build_site.py
      - name: Enable GitHub Pages (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}' || true
